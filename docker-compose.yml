services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
        REACT_APP_USE_MOCKS: ${REACT_APP_USE_MOCKS:-true}
        REACT_APP_SENTRY_DSN: ${REACT_APP_SENTRY_DSN:-}
    image: ${COMPOSE_PREFIX:-workspace}-frontend:latest
    container_name: ${COMPOSE_PREFIX:-workspace}_frontend
    ports:
      - "${EXTERNAL_PORT:-8080}:80"
    restart: unless-stopped
